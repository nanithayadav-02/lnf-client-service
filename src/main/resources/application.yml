spring:
  profiles:
    active: dev-ide

  tenant:
    datasource:
      url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${TENANT_CORE_DB_NAME:tenant_core_db}
      username: ${TENANT_CORE_DB_USERNAME:tenant_core_user}
      password: ${TENANT_CORE_DB_PASSWORD:tenant_core@12345}
      driverClassName: ${DATABASE_DRIVER:org.postgresql.Driver}

  data:
    redis:
      host: ${REDIS_CACHE_HOST:localhost}
      port: ${REDIS_CACHE_PORT:6379}
    cache:
      redis:
        time-to-live: 3600000
        cache-null-values: false
        use-key-prefix: true
      type: redis

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    validate-on-migrate: true

  application:
    name: lnf-client-service

server:
  port: 8081
  servlet:
    context-path: /api/v3

aws:
  s3:
    bucket:
      enabled: true
      service: "/lnf/files"
      folderName: "clients"

application:
  maxInMemorySize: 10485760

connection:
  timeout: 10000

webclient:
  retry:
    enabled: ${WEBCLIENT_RETRY_ENABLED:true}
    max-attempts: ${WEBCLIENT_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-millis: ${WEBCLIENT_RETRY_INITIAL_BACKOFF_MILLIS:200}
    max-backoff-millis: ${WEBCLIENT_RETRY_MAX_BACKOFF_MILLIS:2000}
    jitter: ${WEBCLIENT_RETRY_JITTER:0.5}
  circuitbreaker:
    enabled: ${WEBCLIENT_CIRCUITBREAKER_ENABLED:false}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${CB_SLIDING_WINDOW_SIZE:20}
        minimum-number-of-calls: ${CB_MINIMUM_CALLS:8}
        failure-rate-threshold: ${CB_FAILURE_RATE_THRESHOLD:50}
        slow-call-duration-threshold: ${CB_SLOW_CALL_DURATION_MS:5000ms}
        slow-call-rate-threshold: ${CB_SLOW_CALL_RATE_THRESHOLD:100}
        wait-duration-in-open-state: ${CB_WAIT_DURATION_IN_OPEN_STATE:30s}
        permitted-number-of-calls-in-half-open-state: ${CB_HALF_OPEN_CALLS:5}
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      emp:
        base-config: default

      file:
        base-config: default

      timesheet:
        base-config: default

      email:
        base-config: default

      audit:
        base-config: default

employee:
  service:
    url: "http://localhost:8081/api/v3"

file:
  service:
    url: "http://localhost:8081/api/v3"

timesheet:
  service:
    url: "http://localhost:8081/api/v3"

audit:
  service:
    url: "http://localhost:8081/api/v3"

email:
  service:
    url: "http://localhost:8081/api/v3"

lnf:
  audit:
    enabled: ${AUDIT_ENABLED:false}

  tenant:
    enabled: ${TENANT_ENABLED:false}
    default: ${TENANT_DEFAULT:LNF}
    databaseName: ${TENANT_DATABASE_NAME:client}

  entity-package: "com.lnf.client.model"

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8081/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

tracing:
  url: ${TRACING_URL:http://localhost:4318/v1/traces}

# Metrics Configuration
management:
  tracing:
    sampling:
      probability: 1.0
    enabled: ${TRACING_ENABLED:true}
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    jmx:
      exposure:
        exclude: shutdown
        include: "*"
    web:
      exposure:
        exclude:
        include: "*"
  prometheus.metrics.export.enabled: true
logging:
  level:
    org.springframework: INFO
    org.springframework.data: WARN
    root: ERROR
    com.lnf.client.*: DEBUG
    com.lnf.listener.audit.ChangeTrackerListener: DEBUG

springdoc:
  api-docs:
    path: /lnf-client
  swagger-ui:
    path: /lnf-client-api.html
    enabled: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:client_db
    username: client_user
    password: client@12345
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: drop-and-create
            scripts:
              action: drop-and-create
              create-target: schema.sql
              drop-target: drop-schema.sql
              create-source: metadata
              drop-source: metadata
              create-database-schemas: true
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/lnf
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/lnf/protocol/openid-connect/certs

      client:
        registration:
          client-service:
            client-id: lnf-client-api
            client-secret: ${client-secret:lnf-client-api-secret}
            scope: openid,profile,roles
            authorization-grant-type: client_credentials
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/lnf

printStackTrace: true

