spring:
  profiles:
    active: dev-ide

  redis:
    host: localhost
    port: 6379
  cache:
    redis:
      time-to-live: 3600000
      cache-null-values: false
      use-key-prefix: true
    type: redis

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    validate-on-migrate: true

  application:
    name: lnf-client-service

server:
  port: 8081
  servlet:
    context-path: /api/v3

aws:
  s3:
    bucket:
      enabled: true
      service: "/lnf/files"
      folderName: "clients"

application:
  maxInMemorySize: 10485760

connection:
  timeout: 10000

employee:
  service:
    url: "http://localhost:8081/api/v3"

file:
  service:
    url: "http://localhost:8081/api/v3"

timesheet:
  service:
    url: "http://localhost:8081/api/v3"

audit:
  service:
    url: "http://localhost:8081/api/v3"

email:
  service:
    url: "http://localhost:8081/api/v3"

lnf:
  audit:
    enabled: ${AUDIT_ENABLED:false}

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8081/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

tracing:
  url: ${TRACING_URL:http://localhost:4318/v1/traces}

# Metrics Configuration
management:
  tracing:
    sampling:
      probability: 1.0
    enabled: ${TRACING_ENABLED:true}
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    jmx:
      exposure:
        exclude: shutdown
        include: "*"
    web:
      exposure:
        exclude:
        include: "*"
  prometheus.metrics.export.enabled: true
logging:
  level:
    org.springframework: INFO
    org.springframework.data: WARN
    root: ERROR
    com.lnf.client.*: DEBUG
    com.lnf.listener.audit.ChangeTrackerListener: DEBUG

springdoc:
  api-docs:
    path: /lnf-client
  swagger-ui:
    path: /lnf-client-api.html
    enabled: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:client_db
    username: client_user
    password: client@12345
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: drop-and-create
            scripts:
              action: drop-and-create
              create-target: schema.sql
              drop-target: drop-schema.sql
              create-source: metadata
              drop-source: metadata
              create-database-schemas: true
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/lnf
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/lnf/protocol/openid-connect/certs

      client:
        registration:
          client-service:
            client-id: lnf-client-api
            client-secret: ${client-secret:lnf-client-api-secret}
            scope: openid,profile,roles
            authorization-grant-type: client_credentials
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/lnf

printStackTrace: true

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${database.host:localhost}:${database.port:5432}/${database.name:client_db}
    username: ${database.username:client_user}
    password: ${database.password:client@12345}
    driverClassName: ${database.drive:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:60000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      javax:
        persistence:
          schema-generation:
            scripts:
              action: drop-and-create
              create-database-schemas: false
              create-target: schema.sql
              create-source: metadata
              drop-target: drop-schema.sql
              drop-source: metadata
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/lnf
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/lnf/protocol/openid-connect/certs
      client:
        registration:
          client-service:
            client-id: lnf-client-api
            client-secret: ${client-secret:lnf-client-api-secret}
            scope: openid,profile,roles
            authorization-grant-type: client_credentials
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/lnf

  sql.init.data-locations: classpath*:db/data.sql

printStackTrace: true

