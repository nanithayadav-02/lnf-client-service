spring:
  profiles:
    active: dev

  application:
    name: lnf-client-service

server:
  port: 8081
  servlet:
    context-path: /api/v1

employee:
  service:
    url: "http://localhost:8081/api/v1"

# Metrics Configuration
management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    jmx:
      exposure:
        exclude: shutdown
        include: "*"
    web:
      exposure:
        exclude:
        include: "*"
logging:
  level:
    org:
      springframework: INFO

springdoc:
  api-docs:
    path: /lnf-client
  swagger-ui:
    path: /lnf-client-api.html

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:tsdb
    username: tsuser
    password: ts@12345
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties:
      javax:
        persistence:
          schema-generation:
            database:
              action: drop-and-create
            scripts:
              action: drop-and-create
              create-target: schema.sql
              drop-target: drop-schema.sql
              create-source: metadata
              drop-source: metadata
              create-database-schemas: true
    open-in-view: false

printStackTrace: true

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
#    url: jdbc:postgresql://${database.host:ec2-34-202-158-22.compute-1.amazonaws.com}:${database.port:5432}/${database.name:tsdb}
    url: jdbc:postgresql://${database.host:localhost}:${database.port:5432}/${database.name:client_db}
    username: ${database.username:client_user}
    password: ${database.password:client@12345}
    data: classpath*:db/data.sql
    driverClassName: ${database.drive:org.postgresql.Driver}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      javax:
        persistence:
          schema-generation:
            scripts:
              action: drop-and-create
              create-database-schemas: false
              create-target: schema.sql
              create-source: metadata
              drop-target: drop-schema.sql
              drop-source: metadata
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    show-sql: true

printStackTrace: true
---

spring:
  security:
    oauth2:
      client:
        registration:
          lnf-client-api:
            client-id: lnf-client-api
            client-secret: ${client-secret:76942b56-0dd1-4352-b130-e8fd772c1f9f}
            scope: openid, profile, roles
            authorization-grant-type: client_credentials
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://${keycloak.host:lnf-dev-keycloak.levernfulcrum.com}/auth/realms/lnf
      resourceserver:
        jwt:
          jwk-set-uri: http://${keycloak.host:lnf-dev-keycloak.levernfulcrum.com}/auth/realms/lnf/protocol/openid-connect/certs

