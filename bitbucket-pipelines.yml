image: docker.io/levernfulcrum/lnf-deployment-pipeline:latest
definitions:
  caches:
    maven-cache: ~/.m2/repository
  services:
    docker:
      memory: 2048
pipelines:
  default:
    - step:
        name: Build and Test
        caches:
          - maven-cache
        script:
          # Start ssh-agent
          - eval "$(ssh-agent -s)"

          # Decode the Base64-encoded SSH private key, ensuring it's correctly formatted
          # and adding it to the agent
          - echo "$SSH_PRIVATE_KEY" | base64 --decode | tr -d '\r' | ssh-add -

          # Clone the scripts repository
          - git clone git@bitbucket.org:technofacts/lnf-deployment-pipeline.git

          # Authenticate with AWS CodeArtifact and run Maven build
          - bash lnf-deployment-pipeline/scripts/build-n-push/authenticate.sh $AWS_ACCESS_KEY_ID $AWS_SECRET_ACCESS_KEY

        artifacts:
          - target/**
    - step:
        name: Security Scan
        image: atlassian/default-image:latest
        script:
          # Run a security scan for sensitive data.
          - pipe: atlassian/git-secrets-scan:0.5.1
    - step:
        name: Build and push Docker image
        services:
          - docker
        script:
          # Start ssh-agent
          - eval "$(ssh-agent -s)"

          # Decode the Base64-encoded SSH private key, ensuring it's correctly formatted
          # and adding it to the agent
          - echo "$SSH_PRIVATE_KEY" | base64 --decode | tr -d '\r' | ssh-add -

          # Clone the scripts repository
          - git clone git@bitbucket.org:technofacts/lnf-deployment-pipeline.git

          # Build and push the image to the docker
          - export IMAGE_NAME=levernfulcrum/lnf-client-service
          - chmod +x lnf-deployment-pipeline/scripts/build-n-push/docker_image.sh
          - lnf-deployment-pipeline/scripts/build-n-push/docker_image.sh "$DOCKER_HUB_USERNAME" "$DOCKER_HUB_PASSWORD" "$IMAGE_NAME" "$LNF_TECHNOFACTS"
    - step:
        name: Build and push Docker image to AWS ECR
        services:
          - docker
        script:
          # Start ssh-agent
          - eval "$(ssh-agent -s)"

          # Decode the Base64-encoded SSH private key, ensuring it's correctly formatted
          # and adding it to the agent
          - echo "$SSH_PRIVATE_KEY" | base64 --decode | tr -d '\r' | ssh-add -

          # Clone the scripts repository
          - git clone git@bitbucket.org:technofacts/lnf-deployment-pipeline.git

          # Build and push the image to the AWS ECR
          - export IMAGE_NAME=levernfulcrum/lnf-client-service
          - chmod +x lnf-deployment-pipeline/scripts/build-n-push/ecr_image.sh
          - lnf-deployment-pipeline/scripts/build-n-push/ecr_image.sh "$AWS_DEFAULT_REGION" "$IMAGE_NAME" "$LNF_TECHNOFACTS"